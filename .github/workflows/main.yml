name: Build HK Pools Analyzer APK

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ❌ Hapus baris chmod +x gradlew karena filenya belum ada
      
      - name: Cek isi direktori
        run: ls -la

      # Coba jalankan gradle wrapper langsung, atau gunakan gradle versi sistem
      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HK-Pools-Analyzer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
